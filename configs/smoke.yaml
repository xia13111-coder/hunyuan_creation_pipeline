retopology:
  target_faces: 1200
  voxel_size_factor: 1.0
  smooth_iterations: 1

textures:
  resolution: 256
  samples: 8
  margin: 8
  cage_extrusion: 0.03
  bake_base_color: true
  bake_normal: true
  bake_roughness: true
  bake_metallic: true
  bake_ao: false
  bake_emissive: false
  base_color_transfer: nearest_surface_texture
  pbr_transfer: nearest_surface_texture
  transfer_dilate_iterations: 8
  transfer_fill_uncovered: true
  transfer_fill_max_iterations: 128
  transfer_allow_nearest_fallback: true

qc:
  uv_overlap_grid: 64
  thresholds:
    min_faces: 100
    max_faces: 3000
    max_projection_rms: 0.05
    max_projection_max: 0.15
    max_uv_overlap_ratio: 0.08
    max_uv_out_of_bounds_fraction: 0.0
    max_open_or_nonmanifold_edges: 20
